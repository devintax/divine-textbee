services:
  # MongoDB database
  textbee-db:
    image: mongo:4.4
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-adminUser}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_INITDB_DATABASE=textbee
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - textbee-network

  # NestJS API
  textbee-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-adminUser}:${MONGO_ROOT_PASS}@textbee-db:27017/textbee?authSource=admin
      - MONGO_ROOT_USER=${MONGO_ROOT_USER:-adminUser}
      - MONGO_ROOT_PASS=${MONGO_ROOT_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-60d}
      - FRONTEND_URL=${APP_URL:-http://localhost:3000}
      - REDIS_URL=redis://textbee-redis:6379
      - USE_SMS_QUEUE=${USE_SMS_QUEUE:-false}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY_ID=${FIREBASE_PRIVATE_KEY_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_CLIENT_ID=${FIREBASE_CLIENT_ID}
      - FIREBASE_CLIENT_C509_CERT_URL=${FIREBASE_CLIENT_C509_CERT_URL}
      - SUPPRESSION_API_URL=${GATEWAY_ADMIN_URL:-http://textbee-gateway:4001}
      - SUPPRESSION_API_TOKEN=${GATEWAY_ADMIN_TOKEN}
    depends_on:
      textbee-db:
        condition: service_healthy
    networks:
      - textbee-network

  # Next.js Web Dashboard
  textbee-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${APP_URL:-http://localhost:3000}
        - NEXT_PUBLIC_API_BASE_URL=${APP_URL:-http://localhost:3000}/api/v1
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_SITE_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_BASE_URL=${APP_URL:-http://localhost:3000}/api/v1
      - NEXT_PUBLIC_LATEST_APP_VERSION_CODE=${NEXT_PUBLIC_LATEST_APP_VERSION_CODE:-17}
      - AUTH_SECRET=${AUTH_SECRET}
      - DATABASE_URL=mongodb://${MONGO_ROOT_USER:-adminUser}:${MONGO_ROOT_PASS}@textbee-db:27017/textbee?authSource=admin
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    depends_on:
      - textbee-api
    networks:
      - textbee-network

  # Redis (optional, for SMS queue)
  textbee-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - textbee-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Admin Dashboard (Next.js operations console)
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=${NODE_ENV:-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - TEXTBEE_API_URL=${TEXTBEE_API_URL:-http://textbee-api:3001/api/v1}
      - TEXTBEE_API_KEY=${TEXTBEE_API_KEY}
      - GATEWAY_ADMIN_URL=${GATEWAY_ADMIN_URL:-http://textbee-gateway:4001}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN}
    depends_on:
      - textbee-api
    networks:
      - textbee-network

  # SMS Gateway Service (Twilio-shaped internal API)
  textbee-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=4001
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-adminUser}:${MONGO_ROOT_PASS}@textbee-db:27017/textbee_gateway?authSource=admin
      - TEXTBEE_API_URL=${TEXTBEE_API_URL:-http://textbee-api:3001/api/v1}
      - TEXTBEE_API_KEY=${TEXTBEE_API_KEY}
      - GATEWAY_ADMIN_TOKEN=${GATEWAY_ADMIN_TOKEN}
      - BULK_MAX_RECIPIENTS=${BULK_MAX_RECIPIENTS:-50}
      - BULK_SEND_DELAY=${BULK_SEND_DELAY:-3}
      - SCHEDULER_INTERVAL=${SCHEDULER_INTERVAL:-30000}
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-60000}
      - OFFLINE_THRESHOLD_MULTIPLIER=${OFFLINE_THRESHOLD_MULTIPLIER:-2}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    volumes:
      - gateway_logs:/app/logs
    depends_on:
      textbee-db:
        condition: service_healthy
    networks:
      - textbee-network

  # Cloudflare Tunnel (routes textbee.dfgworld.net -> admin-dashboard, api-textbee.dfgworld.net -> textbee-api)
  textbee-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      - admin-dashboard
      - textbee-api
    networks:
      - textbee-network

networks:
  textbee-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  gateway_logs: